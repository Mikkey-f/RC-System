n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'
lmd: 0.1
lmd_sem: 0.1
SSL_AUG: 'FEARec'

global_ratio: 1
dual_domain: False
std: False
spatial_ratio: 0
fredom: False
fredom_type: None
topk_factor: 1

# dataset: amazon-beauty
dataset: nyc
MAX_ITEM_LIST_LENGTH: 200

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
load_col:
    inter: [user_id, item_id, timestamp]

user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

# 早停核心配置（关键）
early_stop: True  # 启用早停
early_stop_metric: HR@10  # 监控验证集HR@10
early_stop_mode: max  # HR@10越大越好
early_stop_patience: 5  # 连续5个epoch无提升则停止
save_best_model: True  # 保存最优模型权重


# training settings
epochs: 300
train_batch_size: 512
learner: adam
learning_rate: 0.001
eval_step: 1
stopping_step: 10
hidden_dim: 3

# evalution settings
metrics: ['Hit', 'NDCG', 'MRR']
valid_metric: NDCG@10
eval_batch_size: 1024
weight_decay: 0.0
topk: [10, 20]