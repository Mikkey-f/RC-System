gpu_id: '0'
# log_wandb: False
log_wandb: True

# mamba4rec settings
hidden_size: 64               
num_layers: 1                 
dropout_prob: 0.2               
loss_type: 'CE'                 

d_state: 32                     
d_conv: 4                       
expand: 2
initializer_range : 0.02                      
num_experts : 2
num_heads : 8
# dataset settings
# dataset: ml-1m
# MAX_ITEM_LIST_LENGTH: 200       

# dataset: amazon-beauty
dataset: ml-1m
MAX_ITEM_LIST_LENGTH: 200

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
load_col:
    inter: [user_id, item_id, timestamp]

user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

# training settings
epochs: 300
train_batch_size: 256
learner: adam
learning_rate: 0.001
eval_step: 1
stopping_step: 10
train_neg_sample_args: ~
hidden_dim: 3

# evalution settings
metrics: ['Hit', 'NDCG', 'MRR']
valid_metric: NDCG@10
eval_batch_size: 512
weight_decay: 0.0
topk: [10, 20]


# 早停核心配置（关键）
early_stop: True  # 启用早停
early_stop_metric: HR@10  # 监控验证集HR@10
early_stop_mode: max  # HR@10越大越好
early_stop_patience: 5  # 连续5个epoch无提升则停止
save_best_model: True  # 保存最优模型权重

# duorec
lmd: 0.1
lmd_sem: 0.1

tau: 1

# choose from {un, su, us, us_x}
contrast: 'us_x'

# choose from {dot, cos}
sim: 'dot'

hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
inner_size: 256